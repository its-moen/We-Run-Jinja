<script>
/* apply saved theme and accessibility choices before first paint */
(function(){try{var r=document.documentElement,t=localStorage.getItem('wrj-theme');if(!t)t=matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';r.dataset.theme=t;
var a=JSON.parse(localStorage.getItem('wrj-a11y')||'{}');if(a.text)r.dataset.text='lg';if(a.contrast)r.dataset.contrast='high';if(a.motion)r.dataset.motion='reduce';}catch(e){}})();
</script>
